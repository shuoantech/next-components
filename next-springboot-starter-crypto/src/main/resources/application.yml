# License 配置（优先级低于注解）
next:
  license:
    enabled: true
    validate-on-startup: true
    public-key-path: classpath:license/public_key.der
    license-file-path: classpath:license/license.dat
    hardware-validation: true
    expiry-validation: true
    signature-validation: true
    management-enabled: true  # 启用管理接口
    error-message: 授权已过期或无效，请联系管理员
    exclude-paths:
      - /actuator/**
      - /license/**
      - /public/**
      - /swagger-ui/**
      - /v3/api-docs/**